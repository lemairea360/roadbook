<!doctype html><html lang="fr"><head><meta charset="utf-8">
<style>
/* Mode calque : la photo en fond, des étiquettes numérotées par-dessus, légende dans une bande à droite. */
*{box-sizing:border-box}
body{margin:0;width:1500px;height:1000px;position:relative;overflow:hidden;background:#111;font-family:"DejaVu Sans","Unifont-JP",sans-serif}
.photo{position:absolute;left:0;top:0;width:1100px;height:1000px;background:url(photo.jpg) center/contain no-repeat}
.n{position:absolute;width:40px;height:40px;border-radius:50%;background:#c8102e;color:#fff;font-weight:bold;font-size:22px;text-align:center;line-height:40px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.leg{position:absolute;left:1100px;top:0;width:400px;height:1000px;background:#f7f4ec;padding:24px;font-size:20px;color:#1a1a1a}
.leg h1{font-size:26px;margin:0 0 14px}
.leg div{display:flex;gap:10px;margin-bottom:10px;line-height:1.3}
.leg b{color:#c8102e;min-width:30px}
.ja{font-family:"Unifont-JP";color:#777;font-size:15px}
</style></head><body>
<div class="photo"></div>
<!-- une pastille par bouton/zone, coordonnées en pixels sur la photo affichée -->
<div class="n" style="left:300px;top:200px">1</div>
<div class="n" style="left:420px;top:200px">2</div>
<div class="leg">
  <h1>Télécommande — légende</h1>
  <div><b>1</b><span>Marche / arrêt <span class="ja">運転 / 停止</span></span></div>
  <div><b>2</b><span>Chauffage <span class="ja">暖房</span></span></div>
</div>
</body></html>
