<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Japon 2026">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>Japon 2026</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1c1b18; --muted:#78736a;
    --accent:#c43d2f; --accent-soft:#fbeae7; --ok:#2e7d4f; --warn:#b3560e; --warn-soft:#fdf1e3;
    --chip:#eeeae2; --line:#e7e2d8; --sleep:#30557d; --sleep-soft:#e9f0f8;
    --r:16px; --shadow:0 1px 3px rgba(0,0,0,.07),0 4px 14px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141412; --card:#1f1e1b; --ink:#f0ede6; --muted:#a39d91;
      --accent:#e86a5b; --accent-soft:#3a221e; --warn:#e8964a; --warn-soft:#332517;
      --chip:#2c2a26; --line:#33312c; --sleep:#8db4dd; --sleep-soft:#1d2a38;
      --shadow:0 1px 3px rgba(0,0,0,.4); }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg); color:var(--ink); font-size:16px; line-height:1.45;
    padding-bottom:calc(76px + env(safe-area-inset-bottom));}
  header.app{position:sticky; top:0; z-index:10; background:var(--bg);
    padding:calc(10px + env(safe-area-inset-top)) 18px 8px; display:flex; align-items:baseline; justify-content:space-between;}
  header.app h1{font-size:20px; margin:0; letter-spacing:-.02em}
  header.app h1 .jp{color:var(--accent); font-weight:700}
  header.app .count{font-size:13px; color:var(--muted)}
  main{padding:4px 14px 20px; max-width:560px; margin:0 auto;}
  .card{background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); padding:16px; margin:12px 0;}
  .daynav{display:flex; align-items:center; justify-content:space-between; margin:10px 2px 2px;}
  .daynav button{background:var(--chip); border:0; border-radius:12px; width:42px; height:38px; font-size:18px; color:var(--ink); cursor:pointer}
  .daynav .mid{text-align:center}
  .daynav .mid .d{font-weight:700; font-size:17px; text-transform:capitalize}
  .daynav .mid .j{font-size:12px; color:var(--muted)}
  .phase{display:inline-block; font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
    padding:3px 9px; border-radius:99px; background:var(--accent-soft); color:var(--accent); margin-bottom:6px;}
  h2.daytitle{margin:2px 0 0; font-size:21px; letter-spacing:-.02em; line-height:1.25}
  .today-btn{display:block; margin:6px auto 0; background:none; border:0; color:var(--accent); font-size:13px; font-weight:600; cursor:pointer}
  /* dormir */
  .sleep{border-left:4px solid var(--sleep); background:var(--sleep-soft)}
  .sleep .lbl{font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--sleep); text-transform:uppercase}
  .sleep .name{font-size:17px; font-weight:700; margin:2px 0 2px}
  .sleep .meta{font-size:14px; color:var(--muted); margin-bottom:10px}
  .btnrow{display:flex; gap:8px; flex-wrap:wrap}
  .btn{display:inline-flex; align-items:center; gap:6px; border:0; border-radius:11px; padding:9px 13px;
    font-size:14px; font-weight:600; cursor:pointer; text-decoration:none; background:var(--card); color:var(--ink); box-shadow:var(--shadow)}
  .btn.primary{background:var(--sleep); color:#fff; box-shadow:none}
  .code-chip{font-family:ui-monospace,Menlo,monospace; letter-spacing:.03em}
  /* alertes */
  .alert{background:var(--warn-soft); border-radius:12px; padding:10px 12px; margin:8px 0; display:flex; gap:9px; font-size:14.5px}
  .alert b{color:var(--warn)}
  /* programme */
  .slot{display:flex; gap:12px; padding:9px 0; border-bottom:1px solid var(--line); font-size:15px}
  .slot:last-child{border-bottom:0}
  .slot .when{flex:0 0 52px; font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; padding-top:2px}
  .slot .txt a{color:var(--sleep); text-decoration:none; font-weight:600}
  .menu-opt{display:flex; gap:10px; padding:10px 12px; margin:7px 0; background:var(--chip); border-radius:12px; font-size:14.5px; align-items:flex-start; cursor:pointer}
  .menu-opt .em{flex:0 0 auto}
  .menu-opt .mx{flex:1}
  .menu-opt .md{margin-top:7px; padding-top:7px; border-top:1px solid var(--line); font-size:13px; color:var(--muted); line-height:1.45}
  .menu-opt .md a{color:var(--sleep); text-decoration:none; font-weight:600}
  .menu-opt.done{opacity:.5}
  .menu-opt.done .mx{text-decoration:line-through}
  .mk{flex:0 0 28px; height:28px; border:1.5px solid var(--line); background:var(--card); border-radius:9px;
    color:var(--muted); cursor:pointer; font-size:14px; line-height:1; margin-top:-2px}
  .mk.on{background:var(--ok); border-color:var(--ok); color:#fff}
  /* chips pratiques */
  .prats{display:flex; gap:8px; overflow-x:auto; margin:10px 0 2px; padding:2px 2px 6px;
    -webkit-overflow-scrolling:touch; scrollbar-width:none}
  .prats::-webkit-scrollbar{display:none}
  .pchip{flex:0 0 auto; display:inline-flex; align-items:center; gap:6px; background:var(--card); box-shadow:var(--shadow);
    border:0; border-radius:99px; padding:8px 13px; font-size:13.5px; font-weight:600; color:var(--ink);
    cursor:pointer; text-decoration:none; white-space:nowrap; font-family:inherit}
  .pchip.copied{background:var(--ok); color:#fff}
  /* achats */
  .buyrow{display:flex; align-items:flex-start; gap:11px; padding:12px 4px; border-bottom:1px solid var(--line); cursor:pointer; user-select:none; -webkit-user-select:none}
  .buyrow:last-child{border-bottom:0}
  .buyrow .bbox{flex:0 0 24px; height:24px; border-radius:8px; border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff; margin-top:1px}
  .buyrow.done .bbox{background:var(--ok); border-color:var(--ok)}
  .buyrow .k{font-size:14.5px}
  .buyrow .k small{display:block; color:var(--muted)}
  .buyrow.done .k{opacity:.45; text-decoration:line-through}
  /* fiches d'achat (liseuse, montre) */
  .fiche .fhead{display:flex; align-items:flex-start; gap:10px; cursor:pointer; user-select:none; -webkit-user-select:none}
  .fiche .ft{flex:1; min-width:0}
  .fiche .ft .t{font-size:16px; font-weight:700}
  .fiche .ft .dec{font-size:13.5px; color:var(--muted); margin-top:2px}
  .fiche.done .ft{opacity:.45}
  .fiche.done .ft .t{text-decoration:line-through}
  .fiche .chev{color:var(--muted); font-size:14px; margin-top:4px}
  .fiche h4{font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin:16px 0 6px}
  .fiche .ou{font-size:12.5px; color:var(--muted); margin:-2px 0 6px}
  .arb{font-size:13.5px; background:var(--chip); border-radius:10px; padding:8px 10px; margin:6px 0; line-height:1.4}
  .cand{display:flex; gap:10px; align-items:flex-start; padding:9px 10px; margin:6px 0; background:var(--chip); border-radius:12px}
  .cand .cx{flex:1; min-width:0}
  .cand .cm{font-weight:700; font-size:14px}
  .cand .cs{font-size:12.5px; color:var(--muted); margin-top:1px; line-height:1.35}
  .cand .cp{flex:0 0 auto; text-align:right; max-width:42%}
  .cand .jpy{font-size:16.5px; font-weight:800; letter-spacing:-.01em}
  .cand .eur{font-size:12.5px; font-weight:600}
  .cand .frp{font-size:11.5px; color:var(--muted); margin-top:1px}
  .vbadge{display:inline-block; font-size:10.5px; font-weight:700; border-radius:99px; padding:2.5px 8px; margin-top:5px}
  .vbadge.ok{background:var(--ok); color:#fff}
  .vbadge.mid{background:var(--warn-soft); color:var(--warn)}
  .vbadge.no{background:var(--card); color:var(--muted)}
  .ckrow{display:flex; gap:10px; padding:7px 2px; font-size:13.5px; cursor:pointer; align-items:flex-start; user-select:none; -webkit-user-select:none}
  .ckrow .cbx{flex:0 0 21px; height:21px; border-radius:7px; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; margin-top:1px}
  .ckrow.done .cbx{background:var(--ok); border-color:var(--ok)}
  .ckrow.done .ct{opacity:.5; text-decoration:line-through}
  .risk{font-size:13px; background:var(--warn-soft); border-radius:10px; padding:8px 10px; margin-top:8px; line-height:1.4}
  /* calculette ¥ → € */
  .calc{display:flex; align-items:center; gap:8px; font-size:14px}
  .calc input{border:1.5px solid var(--line); border-radius:10px; padding:8px 9px; font-size:15px; background:var(--card); color:var(--ink); font-family:inherit; width:100%; min-width:0}
  .calc input.rate{flex:0 0 60px}
  .calc .sep{color:var(--muted); flex:0 0 auto}
  .calc .eq{font-weight:800; font-size:16.5px; white-space:nowrap; flex:0 0 auto}
  .legend{font-size:12.5px; color:var(--muted); text-align:center; margin:14px 0 6px}
  h3.sec{font-size:12.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin:18px 4px 4px}
  /* liste jours */
  .dayrow{display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--line); cursor:pointer}
  .dayrow .dt{flex:0 0 52px; text-align:center}
  .dayrow .dt .n{font-size:18px; font-weight:700}
  .dayrow .dt .m{font-size:10.5px; color:var(--muted); text-transform:uppercase}
  .dayrow .t{flex:1; font-size:15px}
  .dayrow .t .s{display:block; font-size:12.5px; color:var(--muted)}
  .hotelband{flex:0 0 8px; align-self:stretch; border-radius:4px}
  /* demain */
  .tomorrow{display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer; padding:12px 16px}
  .tomorrow .lbl{font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--muted); text-transform:uppercase}
  .tomorrow .t{font-size:15px; font-weight:600; margin-top:1px}
  .tomorrow .t .s{display:block; font-size:12.5px; color:var(--muted); font-weight:400}
  /* codes */
  .coderow{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 4px; border-bottom:1px solid var(--line)}
  .coderow .k{font-size:14.5px}
  .coderow .k small{display:block; color:var(--muted)}
  .copy{background:var(--chip); border:0; border-radius:10px; padding:8px 11px; font-family:ui-monospace,Menlo,monospace;
    font-size:13.5px; font-weight:600; cursor:pointer; color:var(--ink); white-space:nowrap}
  .copy.copied{background:var(--ok); color:#fff}
  a.tel{color:var(--sleep); text-decoration:none; font-weight:600}
  /* tabbar */
  nav.tabs{position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line);
    display:flex; padding-bottom:env(safe-area-inset-bottom); z-index:20}
  nav.tabs button{flex:1; background:none; border:0; padding:9px 0 7px; font-size:11px; color:var(--muted); cursor:pointer}
  nav.tabs button .ico{display:block; font-size:21px; margin-bottom:1px}
  nav.tabs button.on{color:var(--accent); font-weight:700}
  .toast{position:fixed; bottom:calc(86px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:99px; font-size:14px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:30}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header class="app">
  <h1><span class="jp">日本</span> Japon 2026</h1>
  <span class="count" id="countdown"></span>
</header>
<main id="main"></main>
<nav class="tabs">
  <button data-tab="today" class="on"><span class="ico">☀️</span>Aujourd'hui</button>
  <button data-tab="days"><span class="ico">🗓️</span>Voyage</button>
  <button data-tab="achats"><span class="ico">🛍️</span>Achats</button>
  <button data-tab="infos"><span class="ico">🧭</span>Infos</button>
</nav>
<div class="toast" id="toast">Copié ✓</div>

<script src="./data.js"></script>
<script>
// ———————————————————————— APP ————————————————————————
// Les données du voyage (SLEEPS, DAYS, MENUS, ACHATS, FICHES, CODES, INFOS, PREDEP…)
// vivent dans ./data.js, chargé juste au-dessus — mode d'emploi d'édition : GUIDE.md.
const $ = s => document.querySelector(s);
const PHCOLOR = {"Kyoto":"#c43d2f","Road trip":"#7d9a4f","Tokyo":"#30557d","Vol":"#777"};
const fmt = ds => new Date(ds+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
const fmtS = ds => { const dt=new Date(ds+"T12:00:00"); return {n:dt.getDate(), m:dt.toLocaleDateString("fr-FR",{weekday:"short"})} };
const todayIdx = () => { const t=new Date().toISOString().slice(0,10);
  const i=DAYS.findIndex(d=>d.d>=t); return i<0? DAYS.length-1 : i; };
let cur = todayIdx(), tab="today", openOpt=null;
// Stockage blindé (même pattern que valises.html) : localStorage peut lever SecurityError → repli mémoire.
function mkStore(key){ let backend;
  try{ localStorage.getItem(key); backend=localStorage; }
  catch(e){ const m={}; backend={ getItem:k=>m[k]??null, setItem:(k,v)=>{m[k]=v} }; }
  let st={}; try{ st=JSON.parse(backend.getItem(key)||"{}"); }catch(e){ st={}; }
  return { st, save:()=>backend.setItem(key,JSON.stringify(st)) }; }
const DONE = mkStore("roadbook-done-v1");     // options du menu du jour déjà faites
const BOUGHT = mkStore("roadbook-achats-v1"); // achats cochés
const CHECK = mkStore("roadbook-achats-check-v1"); // checklists magasin des fiches + taux ¥/€ (champ _taux)
function toggleOpt(id){ openOpt = openOpt===id? null : id; render(true); }
function toggleDone(id){ if(DONE.st[id]) delete DONE.st[id]; else DONE.st[id]=1; DONE.save(); render(true); }
function toggleBought(id){ if(BOUGHT.st[id]) delete BOUGHT.st[id]; else BOUGHT.st[id]=1; BOUGHT.save(); render(true); }
// Fiches d'achat dépliables (même pattern que le menu du jour) + mini-calculette ¥ → €.
let openFiche=null, yenVal="";
function toggleFiche(id){ openFiche = openFiche===id? null : id; render(true); }
function toggleCheck(id){ if(CHECK.st[id]) delete CHECK.st[id]; else CHECK.st[id]=1; CHECK.save(); render(true); }
function taux(){ const t=parseFloat(CHECK.st._taux); return t>0? t : TAUX_DEFAUT; }
function eurOut(){ const y=parseFloat(String(yenVal).replace(/[\s¥]/g,"").replace(",","."));
  return y>0? "≈ "+(y/taux()).toLocaleString("fr-FR",{maximumFractionDigits:0})+" €" : "≈ — €"; }
function calcYen(v){ yenVal=String(v).replace(/["'<>]/g,""); $("#calcout").textContent=eurOut(); }
function calcTaux(v){ const t=parseFloat(String(v).replace(",",".")); if(t>0){ CHECK.st._taux=t; CHECK.save(); } $("#calcout").textContent=eurOut(); }
const mapsQ = q => "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
const mapsDir = q => "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(q)+"&travelmode=driving";
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1400); }
function copy(v,btn){ navigator.clipboard?.writeText(v).then(()=>{ toast("Copié ✓"); btn.classList.add("copied"); setTimeout(()=>btn.classList.remove("copied"),1200); }); }
function countdown(){ // bornes dérivées de DAYS (data.js) : départ = 1er jour, fin = lendemain du dernier
  const t=new Date(), dep=new Date(DAYS[0].d+"T12:00:00");
  const i=todayIdx(), diff=Math.ceil((dep-t)/864e5);
  const fin=new Date(DAYS[DAYS.length-1].d+"T12:00:00"); fin.setDate(fin.getDate()+1); fin.setHours(0,0,0,0);
  $("#countdown").textContent = diff>0 ? `J−${diff} ✈️` : (t<fin? `Jour ${i+1}/${DAYS.length}` : "おかえり !"); }
function sleepCard(d){ const s=SLEEPS[d.sleep]; if(!s || d.sleep==="avion") return s? `<div class="card sleep"><div class="lbl">Cette nuit</div><div class="name">${s.name}</div></div>`:"";
  return `<div class="card sleep">
    <div class="lbl">Nuit</div>
    <div class="name">${s.name}</div>
    <div class="meta">${s.area} — ${s.meta}</div>
    <div class="btnrow">
      <a class="btn primary" href="${mapsDir(s.addr)}" target="_blank" rel="noopener">🧭 Y aller</a>
      ${s.code? `<button class="btn code-chip" onclick="copy('${s.code}',this)">⧉ ${s.code}</button>`:""}
      ${s.tel? `<a class="btn" href="tel:${s.tel}">📞 Appeler</a>`:""}
    </div></div>`; }
// (Décision 2026-10-09 : le roadbook ne sert PAS à la préparation — pas de card avant-départ,
// pas de lien vers valises.html. Les deux usages sont distincts.)
function predepCard(){ return ""; }
function pratChips(d){ const chips=[...(d.prat||[])], s=SLEEPS[d.sleep];
  if(s && s.resa) chips.push({t:"📱 Résa logement", href:s.resa});
  if(!chips.length) return "";
  return `<div class="prats">`+chips.map(c=>
    c.copy? `<button class="pchip" onclick="copy('${c.copy}',this)">${c.t}</button>`
    : c.tel? `<a class="pchip" href="tel:${c.tel}">${c.t}</a>`
    : `<a class="pchip" href="${c.href}">${c.t}</a>`).join("")+`</div>`; }
function dayFiche(i){ const d=DAYS[i];
  let h = predepCard();
  h += `<div class="daynav">
      <button onclick="go(${i-1})" ${i===0?"disabled style='opacity:.25'":""}>‹</button>
      <div class="mid"><div class="d">${fmt(d.d)}</div><div class="j">Jour ${i+1} / ${DAYS.length} · ${d.ph}</div></div>
      <button onclick="go(${i+1})" ${i===DAYS.length-1?"disabled style='opacity:.25'":""}>›</button>
    </div>
    ${i!==todayIdx()? `<button class="today-btn" onclick="go(${todayIdx()})">↩︎ revenir à aujourd'hui</button>`:""}
    <div class="card"><span class="phase" style="background:${PHCOLOR[d.ph]}22;color:${PHCOLOR[d.ph]}">${d.ph}</span>
      <h2 class="daytitle">${d.t}</h2></div>`;
  if(d.alerts) h += d.alerts.map(a=>`<div class="alert"><span>⚠️</span><div><b>${a}</b></div></div>`).join("");
  h += pratChips(d);
  h += sleepCard(d);
  if(d.plan){ h += `<h3 class="sec">Programme</h3><div class="card">` +
    d.plan.map(p=>`<div class="slot"><div class="when">${p.w}</div><div class="txt">${p.x}${p.maps? ` <a href="${mapsQ(p.maps)}">📍</a>`:""}</div></div>`).join("") + `</div>`; }
  if(d.menu){ const m=MENUS[d.ph]||[];
    const sorted=[...m].sort((a,b)=>(DONE.st[a.id]?1:0)-(DONE.st[b.id]?1:0)); // fait → fin de liste (tri stable)
    h += `<h3 class="sec">Menu du jour — on choisit au petit-déj</h3>` +
      sorted.map(o=>{ const done=!!DONE.st[o.id], open=openOpt===o.id;
        return `<div class="menu-opt${done?" done":""}" onclick="toggleOpt('${o.id}')">
          <span class="em">${o.e}</span>
          <div class="mx"><span>${o.x}</span>${open&&o.d? `<div class="md">${o.d}${o.maps? ` <a href="${mapsQ(o.maps)}" onclick="event.stopPropagation()">📍 maps</a>`:""}</div>`:""}</div>
          <button class="mk${done?" on":""}" aria-label="fait" onclick="event.stopPropagation();toggleDone('${o.id}')">✓</button></div>`; }).join(""); }
  if(i<DAYS.length-1){ const n=DAYS[i+1], ns=SLEEPS[n.sleep];
    h += `<div class="card tomorrow" onclick="go(${i+1})">
      <div><div class="lbl">Demain</div><div class="t">${n.t}<span class="s">🛏️ ${ns? (ns.area||ns.name):""}</span></div></div>
      <div style="color:var(--muted);font-size:18px">›</div></div>`; }
  return h; }
function viewDays(){ const EMO={"Kyoto":"⛩️","Road trip":"🚗","Tokyo":"🗼"};
  let h="", open=false, prev=null;
  DAYS.forEach((d,i)=>{ const s=SLEEPS[d.sleep], dt=fmtS(d.d);
    if(d.ph!==prev){ if(open) h+=`</div>`;
      const lbl = d.ph==="Vol" ? (i===0? "✈️ Vol aller" : "✈️ Vol retour") : `${EMO[d.ph]||""} ${d.ph}`;
      h+=`<h3 class="sec">${lbl}</h3><div class="card" style="padding:6px 14px">`; open=true; prev=d.ph; }
    h+=`<div class="dayrow" onclick="go(${i})">
      <div class="hotelband" style="background:${s?s.color:'#999'}"></div>
      <div class="dt"><div class="n">${dt.n}</div><div class="m">${dt.m}</div></div>
      <div class="t">${d.t}<span class="s">🛏️ ${s? (s.name.length>34? s.area||s.name : s.name):""}</span></div>
      <div style="color:var(--muted)">›</div></div>`; });
  return h+(open?`</div>`:"")+`<p class="legend">◼︎ couleur = logement : la bande change quand on change de lit</p>`; }
function codesSection(){ return `<div class="card" style="padding:4px 14px">` +
  CODES.map(c=>`<div class="coderow"><div class="k">${c.k}<small>${c.s}</small></div>
    <button class="copy" onclick="copy('${c.v}',this)">${c.v}</button></div>`).join("") + `</div>`; }
function ficheCard(a){ const f=FICHES[a.id], b=!!BOUGHT.st[a.id], open=openFiche===a.id;
  let body="";
  if(open){
    if(f.arb) body += `<h4>À trancher avec Emilie avant le départ</h4>`+f.arb.map(x=>`<div class="arb">${x}</div>`).join("");
    body += `<h4>Candidats</h4>`+f.cands.map(c=>`<div class="cand">
        <div class="cx"><div class="cm">${c.m}</div><div class="cs">${c.s}</div><span class="vbadge ${c.k}">${c.v}</span></div>
        <div class="cp">${c.jp? `<div class="jpy">${c.jp}</div><div class="eur">${c.eur}</div>`:`<div class="frp">${c.jpn}</div>`}<div class="frp">${c.fr}</div></div>
      </div>`).join("");
    body += `<h4>Checklist magasin</h4><div class="ou">${f.ou}</div>`+
      f.check.map(c=>{ const on=!!CHECK.st[c.id];
        return `<div class="ckrow${on?" done":""}" onclick="toggleCheck('${c.id}')">
          <div class="cbx">${on?"✓":""}</div><div class="ct">${c.t}</div></div>`; }).join("");
    body += `<div class="risk">⚠️ ${f.risk}</div>`;
  }
  return `<div class="card fiche${b?" done":""}">
    <div class="fhead" onclick="toggleFiche('${a.id}')">
      <div class="ft"><div class="t">${a.t}${a.who?` <small style="font-weight:400;color:var(--muted)">· ${a.who}</small>`:""}</div>
        <div class="dec">${f.dec}</div></div>
      <button class="mk${b?" on":""}" aria-label="acheté" onclick="event.stopPropagation();toggleBought('${a.id}')">✓</button>
      <span class="chev">${open?"▲":"▼"}</span>
    </div>${body}</div>`; }
function viewAchats(){
  const fiches=ACHATS.filter(a=>FICHES[a.id]), simples=ACHATS.filter(a=>!FICHES[a.id]);
  return `<h3 class="sec">💴 Convertisseur</h3>
  <div class="card calc">
    <input inputmode="decimal" placeholder="Montant ¥" value="${yenVal}" oninput="calcYen(this.value)" aria-label="montant en yens">
    <span class="sep">÷</span>
    <input class="rate" inputmode="decimal" value="${taux()}" oninput="calcTaux(this.value)" aria-label="taux : yens pour 1 euro" title="¥ pour 1 €">
    <span class="eq" id="calcout">${eurOut()}</span>
  </div>
  <h3 class="sec">🛍️ Fiches d'achat — tape pour déplier · ✓ = acheté</h3>`
  + fiches.map(ficheCard).join("")
  + `<h3 class="sec">Autres idées — tape quand c'est acheté</h3><div class="card" style="padding:4px 14px">`
  + simples.map(a=>{ const b=!!BOUGHT.st[a.id], sub=[a.who,a.where,a.note].filter(Boolean).join(" · ");
    return `<div class="buyrow${b?" done":""}" onclick="toggleBought('${a.id}')">
      <div class="bbox">${b?"✓":""}</div>
      <div class="k">${a.t}${sub?`<small>${sub}</small>`:""}</div></div>`; }).join("")
  + `</div><p class="legend">${DETAXE_NOTE}</p>`; }
function viewInfos(){ return `<h3 class="sec">🔑 Codes de résa</h3>` + codesSection() + INFOS.map(b=>{
    let inner = b.rows? b.rows.map(r=>`<div class="coderow"><div class="k">${r[0]}</div><a class="tel" href="tel:${r[1].replace(/[^+\d]/g,'')}">${r[1]}</a></div>`).join("")
      : `<ul style="margin:6px 0 2px;padding-left:20px">${b.list.map(x=>`<li style="margin:6px 0;font-size:14.5px">${x}</li>`).join("")}</ul>`;
    return `<h3 class="sec">${b.h}</h3><div class="card" style="padding:6px 14px">${inner}</div>`; }).join("")
; }
function render(keepScroll){ const m=$("#main"), y=window.scrollY;
  if(tab==="today") m.innerHTML = dayFiche(cur);
  else if(tab==="days") m.innerHTML = viewDays();
  else if(tab==="achats") m.innerHTML = viewAchats();
  else m.innerHTML = viewInfos();
  window.scrollTo(0, keepScroll? y : 0); }
function go(i){ cur=Math.max(0,Math.min(DAYS.length-1,i)); tab="today";
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab==="today")); render(); }
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>{ tab=b.dataset.tab;
  document.querySelectorAll("nav.tabs button").forEach(x=>x.classList.toggle("on",x===b)); render(); }));
countdown(); render();
// PWA : enregistrement simple du service worker (compatible iOS, pas de background sync)
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
</script>
</body>
</html>
